<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ikonico Studio · CRM</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=Outfit:wght@300;400;500;600&family=Lato:ital,wght@0,300;0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#121819; --panel:#1a2325; --panel2:#232e31; --text:#f0e7dc; --muted:#9aa8aa; --line:#2e3b3e;
  --accent:#ff4b00; --accent-ink:#fff; --blue:#aebcf0; --sky:#b1d8e1; --cream:#f0e7dc;
  --ok:#5fcf97; --shadow:0 18px 50px rgba(0,0,0,.45);
  --serif:'Instrument Serif','Times New Roman',serif;
  --sans:'Gill Sans','Gill Sans MT','Hanken Grotesk',system-ui,sans-serif;
}
:root[data-theme="light"]{
  --bg:#f0e7dc; --panel:#fbf8f3; --panel2:#ebe1d3; --text:#121819; --muted:#6a7679; --line:#dccfbd;
  --shadow:0 18px 50px rgba(18,24,25,.18);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.45}
body{min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0;letter-spacing:.2px}
a{color:inherit}
.logo{height:38px;width:auto;display:block}
:root[data-theme="light"] .logo{filter:invert(1)}

/* header */
.topbar{display:flex;align-items:center;gap:18px;padding:14px 28px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:20;flex-wrap:wrap}
.topbar .brand{display:flex;align-items:center;gap:12px}
.topbar .brand span{font-family:var(--serif);font-size:24px;opacity:.9}
.spacer{flex:1}
.user-chip{display:flex;align-items:center;gap:8px;font-weight:600}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block;background:var(--accent);flex:none}
.role-tag{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.ghost{background:transparent;border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px}
.ghost:hover{border-color:var(--accent)}
.zoom{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:13px}
.zoom button{background:none;border:0;cursor:pointer;font-size:16px;padding:0 4px}

/* tabs */
.tabs{display:flex;gap:6px;padding:16px 28px 0;flex-wrap:wrap}
.tab{background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;padding:10px 20px;cursor:pointer;font-weight:600;color:var(--muted)}
.tab.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
main{padding:26px 28px 80px;border-top:1px solid var(--line)}
.page-head{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.page-head h2{font-size:38px}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.1)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.sec{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.sec:hover{border-color:var(--accent)}
.btn.danger{background:transparent;color:#ff7a59;border:1px solid #6b3426}
.btn.small{padding:6px 12px;font-size:13px}

/* tables & cards */
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:900px}
th{text-align:left;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);padding:14px 16px;border-bottom:1px solid var(--line)}
td{padding:14px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.badge{display:inline-block;border-radius:20px;padding:3px 11px;font-size:11px;letter-spacing:1px;text-transform:uppercase;font-weight:600;background:var(--panel2);color:var(--sky)}
:root[data-theme="light"] .badge{color:#3f6a75}
.badge.dir{background:rgba(255,75,0,.16);color:#ff8a57}
.badge.cm{background:rgba(174,188,240,.18);color:var(--blue)}
.badge.ok{background:rgba(95,207,151,.16);color:var(--ok)}
.badge.off{background:rgba(154,168,170,.15);color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.card.inactive{opacity:.55}
.card .top{padding:22px 18px 12px;text-align:center}
.card .emoji{font-size:44px;line-height:1.1}
.card h3{font-size:26px;margin-top:8px}
.card .meta{padding:0 18px 14px;text-align:center;color:var(--muted);font-size:13px;display:flex;flex-direction:column;gap:6px;align-items:center;flex:1}
.card .actions{display:flex;gap:8px;padding:14px 16px;border-top:1px solid var(--line);flex-wrap:wrap;justify-content:center}
.empty{border:1px dashed var(--line);border-radius:16px;padding:46px 20px;text-align:center;color:var(--muted)}
.empty h3{font-size:28px;color:var(--text);margin-bottom:6px}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
select,input[type=text],input[type=email],input[type=number],input[type=date],input[type=tel],input[type=password],textarea{
  background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;outline:none}
select:focus,input:focus,textarea:focus{border-color:var(--accent)}
.toolbar select{width:auto;min-width:200px}

/* scripts */
.script{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:flex;gap:18px;margin-bottom:12px}
.script .folio{font-family:var(--serif);font-size:34px;color:var(--accent);min-width:64px;line-height:1}
.script .body{flex:1;min-width:0}
.script .body h4{margin:0 0 6px;font-size:17px}
.script .txt{color:var(--muted);white-space:pre-wrap;max-height:110px;overflow:hidden;font-size:14px}
.script .side{display:flex;flex-direction:column;gap:8px;align-items:flex-end}

/* página del cliente */
.card.open{cursor:pointer;transition:border-color .15s,transform .15s}
.card.open:hover{border-color:var(--accent);transform:translateY(-2px)}
.cp-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.cp-head .em{font-size:40px;line-height:1}
.cp-head h2{font-size:40px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:4px 11px;font-size:12px;font-weight:600;background:var(--panel2);white-space:nowrap}
.chip .dot{width:8px;height:8px}
.cp-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap}
.cp-tabs div{padding:10px 16px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.cp-tabs .on{color:var(--accent);border-bottom-color:var(--accent)}
.cbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px}
.cbox h4{margin:0 0 4px;font-size:12px;letter-spacing:1.4px;text-transform:uppercase}
.cbox p{margin:0;color:var(--muted);font-size:13px}
.linkrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.linkrow input{flex:1;min-width:220px}
.sc{border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:10px;overflow:hidden}
.sc.st-listo{background:rgba(95,207,151,.08);border-color:rgba(95,207,151,.35)}
.sc-h{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
.sc-h b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.sc-h .car{transition:transform .15s;color:var(--muted)}
.sc.open .car{transform:rotate(180deg)}
.st{border-radius:20px;padding:3px 10px;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;font-weight:700;background:var(--panel2);color:var(--muted);white-space:nowrap}
.st.listo{background:var(--ok);color:#0d2a1c}
.st.edicion{background:rgba(174,188,240,.2);color:var(--blue)}
.sc-b{padding:0 16px 16px;border-top:1px solid var(--line)}
.sc-b .txt{white-space:pre-wrap;padding-top:14px;line-height:1.55}
.sc-meta{font-size:12px;color:var(--muted);margin-top:12px}
.sc-a{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}

/* portal del cliente */
.portal{max-width:980px;margin:0 auto;padding:0 20px 80px}
.portal .ptop{display:flex;align-items:center;gap:12px;padding:18px 0}
.portal .hero{text-align:center;padding:34px 16px 30px;border-radius:20px;margin-bottom:22px;background:linear-gradient(135deg,var(--panel) 0%,var(--panel) 45%,rgba(255,75,0,.28) 100%);border:1px solid var(--line)}
.portal .hero .kick{font-size:11px;letter-spacing:4px;text-transform:uppercase;color:var(--accent);font-weight:700}
.portal .hero .em{font-size:52px;line-height:1;margin:14px 0 6px}
.portal .hero h1{font-size:44px}
.portal .hero p{max-width:560px;margin:10px auto 0;color:var(--muted)}
.portal .cp-tabs div{cursor:pointer}
.evt{margin-bottom:16px}
.evt table{min-width:860px;table-layout:fixed}
.evt tr:not(.mh) th:nth-child(1){width:80px}.evt tr:not(.mh) th:nth-child(2){width:19%}.evt tr:not(.mh) th:nth-child(3){width:27%}
.evt tr:not(.mh) th:nth-child(4),.evt tr:not(.mh) th:nth-child(5){width:118px}.evt tr:not(.mh) th:nth-child(6),.evt tr:not(.mh) th:nth-child(7){width:112px}.evt tr:not(.mh) th:nth-child(8){width:90px}
.evt td{overflow:hidden;text-overflow:ellipsis}
.evt th,.evt td{padding:10px 12px}
.evt .mh th{background:var(--text);color:var(--bg);text-align:center;font-size:12px;letter-spacing:3px}
.pcal-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.pcal-head h3{font-size:30px;text-transform:capitalize;min-width:220px;text-align:center}
.pcal .cell{min-height:96px;cursor:default;padding-top:34px}
.pcal .cell:hover{background:transparent}
.ev{background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:6px 7px;font-size:12px;min-width:0}
.ev b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .pl{display:block;color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .evl{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.ev .evl a,.ev .evl span{font-size:11px;border-radius:5px;padding:2px 6px;text-decoration:none;white-space:nowrap}
.ev .evl a{background:var(--accent);color:#fff;font-weight:600}
.ev .evl span{background:var(--line);color:var(--muted)}
.evlist{margin-top:18px}
.evrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:10px}
.evrow .d{font-family:var(--serif);font-size:26px;min-width:64px;color:var(--accent)}
.evrow .tx{flex:1;min-width:180px}
.evrow .tx small{display:block;color:var(--muted)}
.evrow .bt{display:flex;gap:8px;flex-wrap:wrap}
@media(max-width:700px){ .pcal .ev .evl,.pcal .ev .pl{display:none} .pcal .cell{min-height:70px;padding:30px 3px 4px} .ev{padding:4px 5px;font-size:10.5px} }
.vbox{text-align:center;padding:40px 20px}
.vbox p{color:var(--muted);margin:0 0 18px}

/* calendar */
.cal-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.cal-head h3{font-size:34px;min-width:230px;text-transform:capitalize}
.cal-head select{width:auto}
.cal-head input[type=number]{width:96px}
.cal{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel)}
.dows,.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal .dow{padding:10px;text-align:center;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);background:var(--panel2)}
.cell{position:relative;grid-row:1 / -1;min-height:118px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0}
.cell.c7{border-right:0}
.cell .num{position:absolute;top:5px;right:6px}
.mbar{position:relative;z-index:2;margin:2px 4px;height:30px;display:flex;align-items:center;gap:7px;padding:0 8px;border-radius:7px;font-size:12px;cursor:pointer;min-width:0;overflow:hidden;white-space:nowrap;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-left:4px solid var(--ed,#aebcf0)}
.mbar:hover{border-color:var(--ed,#aebcf0)}
.mbar.from{border-top-left-radius:0;border-bottom-left-radius:0;margin-left:0}
.mbar.to{border-top-right-radius:0;border-bottom-right-radius:0;margin-right:0}
.mbar .bt{overflow:hidden;text-overflow:ellipsis;min-width:40px}
.mbar .who{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis}
.mbar .dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--ed,#aebcf0)}
.mbar .pg{white-space:nowrap;font-size:10.5px;font-weight:700;border-radius:20px;padding:1px 7px;background:var(--line)}
.mbar .gs{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:5px;font-size:11px;padding:1px 5px;cursor:pointer;color:var(--text)}
.mbar .chk{flex:none;width:18px;height:18px;border-radius:5px;border:1.5px solid var(--muted);background:transparent;color:#fff;font-size:12px;line-height:1;display:grid;place-items:center;cursor:pointer;padding:0}
.mbar .ar{color:var(--muted);font-weight:700}
.mbar .rz{position:absolute;right:0;top:0;bottom:0;width:12px;cursor:ew-resize;touch-action:none}
.mbar .rz::after{content:'';position:absolute;right:3px;top:50%;width:4px;height:16px;transform:translateY(-50%);border-radius:3px;background:var(--ed,#aebcf0);opacity:.45}
.mbar:hover .rz::after{opacity:1}
.mbar.done{border-left-color:var(--ok);background:rgba(95,207,151,.10)}
.mbar.done .pg{background:rgba(95,207,151,.18);color:var(--ok)}
.mbar.done .chk{background:var(--ok);border-color:var(--ok)}
body.resizing .mbar,body.resizing .pill{pointer-events:none}
.can-move .pill,.can-move .mbar{cursor:grab;user-select:none;-webkit-user-select:none}
body.moving,body.moving *{cursor:grabbing!important;user-select:none}
.ghost-it{opacity:.35}
/* meta semanal */
.goals{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.goals .gh{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.goals .gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px 22px}
.goal .gn{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.goal .gn span{font-weight:700}
.goal .gb{height:10px;border-radius:10px;background:var(--panel2);overflow:hidden}
.goal .gb i{display:block;height:100%;border-radius:10px;transition:width .4s}
.goal.me .gn b::after{content:' · tú';color:var(--accent);font-weight:600}
.cell:hover{background:var(--panel2)}
.cell.out{opacity:.38}
.cell.today .num{background:var(--accent);color:#fff}
.num{align-self:flex-end;font-size:12px;font-weight:600;width:24px;height:24px;border-radius:50%;display:grid;place-items:center}
.pill{position:relative;border-radius:7px;padding:5px 7px 6px;font-size:12px;cursor:pointer;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-left:4px solid var(--ed,#aebcf0);min-width:0}
.pill:hover{border-color:var(--ed,#aebcf0)}
.pill .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:22px}
.pill .who{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);margin-top:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pill .dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--ed,#aebcf0)}
.pill .ft{display:flex;align-items:center;gap:5px;margin-top:4px;flex-wrap:wrap}
.pill .pg{white-space:nowrap;font-size:10.5px;font-weight:700;border-radius:20px;padding:1px 7px;background:var(--line);color:var(--text)}
.pill .chk{position:absolute;top:4px;right:4px;width:18px;height:18px;border-radius:5px;border:1.5px solid var(--muted);background:transparent;color:#fff;font-size:12px;line-height:1;display:grid;place-items:center;cursor:pointer;padding:0}
.pill .chk:hover{border-color:var(--ok)}
.pill .gs{white-space:nowrap;margin-left:auto;border:1px solid var(--line);background:var(--panel);border-radius:5px;font-size:11px;padding:1px 5px;cursor:pointer;color:var(--text)}
.pill .gs:hover{border-color:var(--accent)}
.pill.done{border-left-color:var(--ok)}
.pill.done .pg{background:rgba(95,207,151,.18);color:var(--ok)}
.pill.done .chk{background:var(--ok);border-color:var(--ok)}
.pill.done .t{opacity:.75}
.pill .rz{position:absolute;right:0;top:26px;bottom:0;width:12px;cursor:ew-resize;touch-action:none}
.pill .rz::after{content:'';position:absolute;right:3px;top:50%;width:4px;height:18px;transform:translateY(-50%);border-radius:3px;background:var(--ed,#aebcf0);opacity:.35;transition:opacity .15s}
.pill:hover .rz::after{opacity:1}
.cell.span-on{background:rgba(255,75,0,.13);box-shadow:inset 0 0 0 2px var(--accent)}
body.resizing,body.resizing *{cursor:ew-resize!important;user-select:none}
.mytasks{margin-bottom:14px;color:var(--muted);font-size:14px}
.mytasks summary{cursor:pointer;color:var(--text);font-weight:600}
.mytasks pre{white-space:pre-wrap;font-family:inherit;margin:8px 0 0}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:flex-start;justify-content:center;padding:36px 16px;overflow:auto;z-index:50}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:100%;max-width:640px;padding:28px;box-shadow:var(--shadow)}
.modal h3{font-size:30px;padding-bottom:12px;border-bottom:2px solid var(--accent);margin-bottom:18px}
.f{margin-bottom:14px}
.f label{display:block;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.f label.chkrow{display:flex;align-items:center;gap:10px;font-size:14px;letter-spacing:0;text-transform:none;color:var(--text);cursor:pointer}
.chkrow input{width:18px;height:18px;accent-color:var(--accent)}
.hint{font-size:12px;color:var(--muted);margin-top:5px}
.mfoot{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.range{display:flex;align-items:center;gap:14px}
.range input{flex:1;accent-color:var(--accent)}
.range b{min-width:48px;text-align:right;font-size:18px}
.bar{height:6px;border-radius:6px;background:var(--panel2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login .box{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:34px 30px;text-align:center;box-shadow:var(--shadow)}
.login .logo{height:52px;margin:0 auto 22px}
.login h1{font-size:34px;margin-bottom:6px}
.login p{color:var(--muted);margin:0 0 22px}
.pin-dots{display:flex;gap:14px;justify-content:center;margin:6px 0 22px}
.pin-dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted)}
.pin-dots i.on{background:var(--accent);border-color:var(--accent)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:16px 0;font-size:22px;cursor:pointer}
.pad button:hover{border-color:var(--accent)}
.err{color:#ff8a66;min-height:20px;margin-top:14px;font-size:14px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:10px;font-weight:600;z-index:80;box-shadow:var(--shadow);max-width:90vw}

<script>
'use strict';
/* ====== Configuración ====== */
const SB_URL = 'https://ufftpwvquoohizzbrzty.supabase.co';
const SB_KEY = 'sb_publishable_6mKJT_RRc0Ls2-VDBtdMzw_UdtRkorp';
const DEFAULT_TASKS = "• Revisar el calendario de edición\n• Descargar los archivos de la carpeta del cliente\n• Leer los guiones de tus clientes\n• Marcar \"Listo\" cuando se apruebe un video";
const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MON_SHORT = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DOW = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const BASE_ROLES = ['Dirección','Edición','CM'];

/* ====== Utilidades ====== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : v; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, v); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const pad2 = n => String(n).padStart(2,'0');
const ymd = (y,m,d) => `${y}-${pad2(m+1)}-${pad2(d)}`;
const todayStr = () => { const t = new Date(); return ymd(t.getFullYear(), t.getMonth(), t.getDate()); };
function fmtBirthday(s){ if(!s) return '—'; const [y,m,d] = s.split('-').map(Number); return `${d} ${MON_SHORT[m-1]}`; }
function safeUrl(u){ try{ const x = new URL(String(u||'').trim()); return /^https?:$/.test(x.protocol) ? x.href : ''; }catch(e){ return ''; } }
function linkLabel(u){
  const h = (()=>{ try{ return new URL(u).hostname; }catch(e){ return ''; } })();
  if(/frame\.io/.test(h)) return 'Frame.io';
  if(/drive\.google|docs\.google/.test(h)) return 'Drive';
  if(/dropbox/.test(h)) return 'Dropbox';
  return 'carpeta';
}
function inkFor(hex){
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || ''); if(!m) return '#fff';
  const n = parseInt(m[1],16), r = n>>16, g = (n>>8)&255, b = n&255;
  return (0.299*r + 0.587*g + 0.114*b) > 160 ? '#121819' : '#fff';
}
function toast(msg){
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3600);
}
const ERR_TXT = {
  pin_incorrecto:'PIN incorrecto', demasiados_intentos:'Demasiados intentos. Espera unos minutos.',
  pin_invalido:'El PIN debe tener exactamente 4 dígitos', pin_en_uso:'Ese PIN ya lo usa otra persona',
  sin_permiso:'No tienes permiso para hacer esto', nombre_requerido:'Escribe un nombre',
  ultimo_director:'No puedes eliminar al último usuario de Dirección', ya_configurado:'El CRM ya tiene usuarios',
  link_invalido:'Este link ya no es válido. Pide uno nuevo a Ikonico Studio.', folio_requerido:'Escribe el número de video',
  no_existe:'Ese guion ya no existe'
};
const PORTAL_KEY = (() => { try{ return new URLSearchParams(location.search).get('cliente') || ''; }catch(e){ return ''; } })();
const GUION_ID = (() => { try{ return new URLSearchParams(location.search).get('guion') || ''; }catch(e){ return ''; } })();
const portalUrl = tok => location.origin + location.pathname + '?cliente=' + encodeURIComponent(tok);
const errMsg = c => ERR_TXT[c] || 'Algo salió mal. Intenta de nuevo.';

/* ====== API ====== */
async function rpc(fn, args){
  let r;
  try{
    r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, {
      method:'POST', headers:{'Content-Type':'application/json', apikey:SB_KEY}, body:JSON.stringify(args || {})
    });
  }catch(e){ throw new Error('Sin conexión. Revisa tu internet.'); }
  const txt = await r.text(); let d = null;
  try{ d = txt ? JSON.parse(txt) : null; }catch(e){ d = txt; }
  if(!r.ok){
    if(d && d.message === 'sesion_invalida'){ doLogout(true); throw new Error('Tu sesión venció. Entra de nuevo con tu PIN.'); }
    const e = new Error((d && d.message) || 'Error de servidor'); e.code = d && d.code; throw e;
  }
  return d;
}
const T = () => S.token;
const select = tbl => rpc('crm_select', {p_token:T(), p_tbl:tbl});
const saveRow = (tbl,row) => rpc('crm_save', {p_token:T(), p_tbl:tbl, p_row:row});
async function delRow(tbl,id){
  try{ return await rpc('crm_delete', {p_token:T(), p_tbl:tbl, p_id:id}); }
  catch(e){
    if(e.code === 'PGRST202') return {error:'sin_funcion'};
    throw e;
  }
}

/* ====== Estado ====== */
const S = {
  token: store.get('ikonico_token',''), me:null, view:'calendar', loading:true, needBoot:false,
  team:[], clients:[], scripts:[], items:[], events:[], week:[],
  quotes:[], qset:null, qready:false, qerr:'', q:null, qdirty:false, qfilter:'todas',
  scriptClient:'', clientId:'', openScript:null, prevView:'', clientTab:'guiones', standalone:false, cal:{y:new Date().getFullYear(), m:new Date().getMonth(), editor:''},
  clientFilter:'activos', pin:'', loginErr:'', theme: store.get('ikonico_theme','dark'), zoom: +store.get('ikonico_zoom','100')
};
const isAdmin = () => S.me && S.me.role === 'Dirección';
const canManage = () => S.me && (S.me.role === 'Dirección' || S.me.role === 'CM');
const member = id => S.team.find(t => t.id === id);
const client = id => S.clients.find(c => c.id === id);
const roleBadge = r => `<span class="badge ${r==='Dirección'?'dir':r==='CM'?'cm':''}">${esc(r)}</span>`;

function applyPrefs(){
  document.documentElement.setAttribute('data-theme', S.theme);
  document.body.style.zoom = S.zoom === 100 ? '' : (S.zoom/100);
}

async function loadAll(){
  const [team, clients, scripts, items, events] = await Promise.all(['team_members','clients','scripts','calendar_items','client_events'].map(select).concat(loadWeek()));
  S.team = team || []; S.clients = clients || []; S.scripts = scripts || []; S.items = items || [];
  S.events = Array.isArray(events) ? events : [];
  if(isAdmin()) await loadQuotes();
}
/* Meta semanal: videos agendados a cada editor esta semana (dom–sáb) contra los terminados */
function weekRange(){
  const t = new Date(), s = new Date(t.getFullYear(), t.getMonth(), t.getDate() - t.getDay()), e = new Date(s.getFullYear(), s.getMonth(), s.getDate() + 6);
  return [ymd(s.getFullYear(), s.getMonth(), s.getDate()), ymd(e.getFullYear(), e.getMonth(), e.getDate())];
}
async function loadWeek(){
  const [a, b] = weekRange();
  try{ const r = await rpc('crm_week_stats', {p_token:T(), p_from:a, p_to:b}); S.week = Array.isArray(r) ? r : []; }
  catch(e){ S.week = []; }
}
function weekGoals(){
  const [a, b] = weekRange();
  const rows = S.week.map(g => {
    const pct = g.total ? Math.round(g.done / g.total * 100) : 0;
    return `<div class="goal ${S.me && g.editor_id === S.me.id ? 'me' : ''}"><div class="gn"><b>${esc(g.name)}</b><span>${g.done}/${g.total}${g.done >= g.total ? ' 🎉' : ''}</span></div>
      <div class="gb"><i style="width:${pct}%;background:${esc(g.color || '#ff4b00')}"></i></div></div>`;
  }).join('');
  return `<div class="goals"><div class="gh">Objetivo de la semana · ${fmtDay(a)} – ${fmtDay(b)} · videos de edición por editor</div>
    ${rows ? `<div class="gl">${rows}</div>` : `<span class="hint">Todavía no hay videos agendados esta semana.</span>`}</div>`;
}

/* ====== Sesión ====== */
async function boot(){
  applyPrefs();
  if(PORTAL_KEY) return loadPortal();
  if(S.token){
    try{ S.me = await rpc('crm_me', {p_token:S.token}); await loadAll(); S.loading = false; defaultView(); guionRoute(); return; }
    catch(e){ S.token = ''; store.del('ikonico_token'); }
  }
  try{ S.needBoot = await rpc('crm_bootstrap_needed'); }catch(e){ S.needBoot = false; S.loginErr = 'No pude conectar con la base de datos.'; }
  S.loading = false; render();
}
function defaultView(){
  S.view = isAdmin() ? 'team' : (S.me.role === 'CM' ? 'clients' : 'calendar');
  if(!isAdmin()) S.view = S.me.role === 'CM' ? 'clients' : 'calendar';
}
async function afterAuth(res){
  if(res.error){ S.loginErr = errMsg(res.error); S.pin = ''; render(); return; }
  S.token = res.token; S.me = res.member; store.set('ikonico_token', S.token);
  S.loginErr = ''; S.pin = ''; S.loading = true; render();
  try{ await loadAll(); }catch(e){ toast(e.message); }
  S.loading = false; defaultView(); guionRoute();
}
/* ?guion=<id>: pestaña aparte con la página del cliente y ese guion abierto (el calendario sigue en la otra pestaña) */
function guionRoute(){
  const s = GUION_ID && S.scripts.find(x => x.id === GUION_ID);
  if(!s){ render(); return; }
  S.standalone = true; openClient(s.client_id, s.id);
}
function doLogout(silent){
  if(S.token && !silent){ rpc('crm_logout', {p_token:S.token}).catch(()=>{}); }
  S.token = ''; S.me = null; store.del('ikonico_token'); S.pin = ''; S.loginErr = '';
  rpc('crm_bootstrap_needed').then(v => { S.needBoot = v; render(); }).catch(()=>render());
  render();
}

/* ====== Render ====== */
function logoImgs(){ return `<img class="logo" src="logo.png" alt="Ikonico Studio">`; }

function render(){
  const root = $('#root');
  if(S.loading){ root.innerHTML = `<div class="loading">Cargando…</div>`; return; }
  if(PORTAL_KEY){ root.innerHTML = portalView(); return; }
  if(!S.me){ root.innerHTML = loginView(); bindLogin(); return; }
  const tabs = [];
  if(isAdmin()) tabs.push(['team','Team']);
  if(canManage()) tabs.push(['clients','Clientes']);
  if(isAdmin()) tabs.push(['quotes','Cotizaciones']);
  if(!canManage()) tabs.push(['scripts','Mis guiones']);
  tabs.push(['calendar','Calendario de edición']);
  if(S.view === 'client' && !client(S.clientId)) S.view = S.prevView || '';
  if(S.view === 'quote' && !(isAdmin() && S.q)) S.view = 'quotes';
  if(S.view !== 'client' && S.view !== 'quote' && !tabs.find(t => t[0] === S.view)) S.view = tabs[0][0];
  const activeTab = S.view === 'client' ? (canManage() ? 'clients' : S.prevView) : S.view === 'quote' ? 'quotes' : S.view;
  let main = '';
  if(S.view === 'team') main = teamView();
  else if(S.view === 'client') main = clientPage();
  else if(S.view === 'clients') main = clientsView();
  else if(S.view === 'quotes') main = quotesView();
  else if(S.view === 'quote') main = quoteEditor();
  else if(S.view === 'scripts') main = scriptsView();

function loginView(){
  if(S.needBoot){
    return `<div class="login"><div class="box">${logoImgs()}
      <h1>Bienvenido</h1><p>Crea tu usuario de Dirección. Con este PIN entrarás siempre al CRM.</p>
      <form id="boot-form" autocomplete="off">
        <div class="f" style="text-align:left"><label>Tu nombre</label><input type="text" name="name" required placeholder="Ej. Sofía Loarca"></div>
        <div class="f" style="text-align:left"><label>Tu PIN (4 dígitos)</label><input type="password" name="pin" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" required placeholder="••••"></div>
        <div class="f" style="text-align:left"><label>Repite tu PIN</label><input type="password" name="pin2" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" required placeholder="••••"></div>
        <button class="btn" style="width:100%">Crear mi acceso</button>
      </form><div class="err">${esc(S.loginErr)}</div></div></div>`;
  }
  const dots = [0,1,2,3].map(i => `<i class="${i < S.pin.length ? 'on':''}"></i>`).join('');
  const keys = ['1','2','3','4','5','6','7','8','9','','0','⌫'].map(k => k === '' ? '<span></span>' : `<button data-act="key" data-k="${k}">${k}</button>`).join('');
  return `<div class="login"><div class="box">${logoImgs()}
    <h1>Bienvenido</h1><p>Ingresa tu PIN · Producción de eventos y contenido</p>
    <div class="pin-dots">${dots}</div><div class="pad">${keys}</div>
    <div class="err">${esc(S.loginErr)}</div></div></div>`;
}
function bindLogin(){
  const f = $('#boot-form');
  if(f) f.addEventListener('submit', async e => {
    e.preventDefault(); const d = new FormData(f);
    if(d.get('pin') !== d.get('pin2')){ S.loginErr = 'Los PIN no coinciden'; render(); return; }
    try{ const res = await rpc('crm_bootstrap', {p_name:d.get('name'), p_pin:d.get('pin')}); afterAuth(res); }
    catch(err){ S.loginErr = err.message; render(); }
  });
}
async function pinKey(k){
  if(k === '⌫') S.pin = S.pin.slice(0,-1);
  else if(S.pin.length < 4) S.pin += k;
  S.loginErr = ''; render();
  if(S.pin.length === 4){
    try{ const res = await rpc('crm_login', {p_pin:S.pin}); afterAuth(res); }
    catch(err){ S.pin = ''; S.loginErr = err.message; render(); }
  }
}
document.addEventListener('keydown', e => {
  if(PORTAL_KEY || S.me || S.needBoot || S.loading) return;
  if(/^[0-9]$/.test(e.key)) pinKey(e.key); else if(e.key === 'Backspace') pinKey('⌫');
});

/* Estirar una tarjeta: se arrastra el asa del último día hasta el día final */
const MAX_SPAN_DAYS = 3;
const dayMs = s => Date.UTC(+s.slice(0,4), +s.slice(5,7) - 1, +s.slice(8,10));
const dayDiff = (a, b) => Math.round((dayMs(b) - dayMs(a)) / 864e5);
const addDays = (s, n) => new Date(dayMs(s) + n * 864e5).toISOString().slice(0, 10);
let skipClick = false;
function startResize(id, e){
  const it = S.items.find(x => x.id === id); if(!it) return;
  const start = it.start_date, orig = it.end_date || start, lim = addDays(start, MAX_SPAN_DAYS - 1), max = orig > lim ? orig : lim;
  let end = orig;
  const cells = [...document.querySelectorAll('.cell[data-d]')];
  const paint = () => cells.forEach(c => c.classList.toggle('span-on', c.dataset.d >= start && c.dataset.d <= end));
  const move = ev => {
    const el = document.elementFromPoint(ev.clientX, ev.clientY), cell = el && el.closest('.cell[data-d]');
    if(!cell) return;
    const d = cell.dataset.d; end = d < start ? start : d > max ? max : d; paint();
  };
  const up = async () => {
    window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up);
    document.body.classList.remove('resizing'); cells.forEach(c => c.classList.remove('span-on'));
    skipClick = true; setTimeout(() => { skipClick = false; }, 60);
    if(end === orig) return;
    const prev = it.end_date; it.end_date = end === start ? null : end; render();
    try{
      const row = {id:it.id, client_id:it.client_id, video_number:it.video_number, title:it.title, start_date:start, end_date:it.end_date,
        editor_id:it.editor_id, progress:it.progress, done:it.done, notes:it.notes};
      const r = await saveRow('calendar_items', row);
      if(r && r.error) throw new Error(errMsg(r.error));
      const n = dayDiff(start, end) + 1; toast(n === 1 ? 'Ahora dura 1 día' : `Ahora dura ${n} días`);
      await loadWeek(); render();
    }catch(err){ it.end_date = prev; render(); toast(err.message); }
  };
  document.body.classList.add('resizing'); paint();
  window.addEventListener('pointermove', move); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
}
document.addEventListener('pointerdown', e => {
  const h = e.target.closest('[data-rz]'); if(!h || !canManage()) return;
  e.preventDefault(); e.stopPropagation(); startResize(h.dataset.rz, e);
});
/* Mover una tarjeta a otro día arrastrándola (conserva cuántos días dura) */
const cellAt = (x, y) => document.elementsFromPoint(x, y).find(n => n.matches && n.matches('.cell[data-d]'));
let drag = null;
function paintMove(){
  const it = S.items.find(x => x.id === drag.id); if(!it) return;
  const delta = dayDiff(drag.from, drag.to), a = addDays(it.start_date, delta), b = addDays(it.end_date || it.start_date, delta);
  document.querySelectorAll('.cell[data-d]').forEach(c => c.classList.toggle('span-on', c.dataset.d >= a && c.dataset.d <= b));
}
document.addEventListener('pointerdown', e => {
  if(e.button !== 0 || !canManage() || S.view !== 'calendar' || e.target.closest('[data-rz],button,a')) return;
  const el = e.target.closest('.pill[data-id],.mbar[data-id]'), cell = el && cellAt(e.clientX, e.clientY);
  if(!cell) return;
  drag = {id:el.dataset.id, x:e.clientX, y:e.clientY, from:cell.dataset.d, to:cell.dataset.d, on:false};
});
window.addEventListener('pointermove', e => {
  if(!drag) return;
  if(!drag.on){
    if(Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 6) return;
    drag.on = true; document.body.classList.add('moving');
    document.querySelectorAll(`[data-id="${CSS.escape(drag.id)}"].pill,[data-id="${CSS.escape(drag.id)}"].mbar`).forEach(n => n.classList.add('ghost-it'));
  }
  const cell = cellAt(e.clientX, e.clientY); if(cell) drag.to = cell.dataset.d;
  paintMove();
});
const endMove = async e => {
  if(!drag) return;
  const d = drag; drag = null;
  if(!d.on) return;
  document.body.classList.remove('moving');
  document.querySelectorAll('.span-on,.ghost-it').forEach(n => n.classList.remove('span-on', 'ghost-it'));
  skipClick = true; setTimeout(() => { skipClick = false; }, 60);
  const it = S.items.find(x => x.id === d.id), delta = dayDiff(d.from, d.to);
  if(!it || e.type === 'pointercancel' || !delta) return;
  const prev = {start_date:it.start_date, end_date:it.end_date};
  it.start_date = addDays(it.start_date, delta); if(it.end_date) it.end_date = addDays(it.end_date, delta);
  render();
  try{
    const row = {id:it.id, client_id:it.client_id, video_number:it.video_number, title:it.title, start_date:it.start_date, end_date:it.end_date,
      editor_id:it.editor_id, progress:it.progress, done:it.done, notes:it.notes};
    const r = await saveRow('calendar_items', row);
    if(r && r.error) throw new Error(errMsg(r.error));
    toast(`Movido al ${fmtDay(it.start_date)}`);
    await loadWeek(); render();
  }catch(err){ Object.assign(it, prev); render(); toast(err.message); }
};
window.addEventListener('pointerup', endMove);
window.addEventListener('pointercancel', endMove);
function calendarView(){
  const {y,m} = S.cal; const first = new Date(y,m,1).getDay(); const days = new Date(y,m+1,0).getDate();
  const prevDays = new Date(y,m,0).getDate(); const tStr = todayStr();
  const total = Math.ceil((first + days) / 7) * 7;
  const dayAt = i => {
    let dy = y, dm = m, dd = i - first + 1, out = false;
    if(dd < 1){ dm = m-1; dd = prevDays + dd; out = true; if(dm < 0){ dm = 11; dy = y-1; } }
    else if(dd > days){ dd = dd - days; dm = m+1; out = true; if(dm > 11){ dm = 0; dy = y+1; } }
    return {dd, out, ds:ymd(dy,dm,dd)};
  };
  const info = it => {
    const c = client(it.client_id), e = member(it.editor_id);
    return {c, e, col:(e && e.color) || '#aebcf0', sc:scriptFor(it),
      canDone: canManage() || (S.me && it.editor_id === S.me.id),
      label:(it.video_number ? it.video_number + ' — ' : '') + (c ? c.name : 'Sin cliente')};
  };
  const chk = (it, ok) => ok ? `<button type="button" class="chk" data-act="cal-done" data-id="${it.id}" title="${it.done?'Reabrir':'Marcar como listo'}">${it.done?'✓':''}</button>` : '';
  const gs = sc => sc ? `<button type="button" class="gs" data-act="cal-script" data-id="${sc.id}" title="Abrir el guion en otra pestaña">📄 Guion</button>` : '';
  const rz = it => canManage() ? `<span class="rz" data-rz="${it.id}" title="Arrastra para que dure más días (hasta ${MAX_SPAN_DAYS})"></span>` : '';
  const pill = it => {
    const {c, e, col, sc, canDone, label} = info(it);
    return `<div class="pill ${it.done?'done':''}" data-act="cal-item" data-id="${it.id}" style="--ed:${esc(col)}" title="${esc(label+(it.title?' · '+it.title:''))}">
      <div class="t">${esc(c&&c.emoji?c.emoji+' ':'')}${esc(label)}</div>
      <div class="who"><i class="dot"></i>${esc(e ? e.name : 'Sin responsable')}</div>
      <div class="ft"><span class="pg">${it.done?'✓ Listo':it.progress+'%'}</span>${gs(sc)}</div>${chk(it, canDone)}${rz(it)}</div>`;
  };
  const isMulti = it => it.end_date && it.end_date !== it.start_date;
  const byEditor = it => !S.cal.editor || it.editor_id === S.cal.editor;
  let weeks = '';
  for(let w = 0; w < total / 7; w++){
    const wd = [0,1,2,3,4,5,6].map(k => dayAt(w * 7 + k)), ws = wd[0].ds, we = wd[6].ds;
    // Videos de varios días: una barra por video, acomodadas en carriles para que no se encimen
    const multi = S.items.filter(it => isMulti(it) && byEditor(it) && it.start_date <= we && it.end_date >= ws)
      .sort((a,b) => a.start_date.localeCompare(b.start_date) || b.end_date.localeCompare(a.end_date));
    const laneEnd = [], bars = [];
    multi.forEach(it => {
      const a = it.start_date < ws ? ws : it.start_date, b = it.end_date > we ? we : it.end_date;
      const c1 = dayDiff(ws, a), c2 = dayDiff(ws, b);
      let lane = laneEnd.findIndex(x => x < c1); if(lane < 0){ lane = laneEnd.length; laneEnd.push(-1); }
      laneEnd[lane] = c2;
      const {c, e, col, sc, canDone, label} = info(it), from = it.start_date < ws, to = it.end_date > we;
      bars.push(`<div class="mbar ${it.done?'done':''} ${from?'from':''} ${to?'to':''}" data-act="cal-item" data-id="${it.id}" style="--ed:${esc(col)};grid-column:${c1+1} / ${c2+2};grid-row:${lane+2}" title="${esc(label+(it.title?' · '+it.title:'')+' · '+fmtDay(it.start_date)+' – '+fmtDay(it.end_date))}">
        ${from ? '<span class="ar">←</span>' : ''}<b class="bt">${esc(c&&c.emoji?c.emoji+' ':'')}${esc(label)}</b>${gs(sc)}
        <span class="who"><i class="dot"></i>${esc(e ? e.name : 'Sin responsable')}</span><span class="spacer"></span>
        <span class="pg">${it.done?'✓ Listo':it.progress+'%'}</span>${chk(it, canDone)}${to ? '<span class="ar">→</span>' : rz(it)}</div>`);
    });
    const L = laneEnd.length;
    const cells = wd.map((d, k) => {
      const pills = S.items.filter(it => !isMulti(it) && byEditor(it) && it.start_date === d.ds).map(pill).join('');
      return `<div class="cell ${d.out?'out':''} ${d.ds===tStr?'today':''} ${k===6?'c7':''}" data-act="cal-day" data-d="${d.ds}" style="grid-column:${k+1};padding-top:${34 + L*34}px"><div class="num">${d.dd}</div>${pills}</div>`;
    }).join('');
    weeks += `<div class="wk" style="grid-template-rows:32px repeat(${L},34px) 1fr">${cells}${bars.join('')}</div>`;
  }
  const yrs = []; for(let k = new Date().getFullYear()-2; k <= new Date().getFullYear()+8; k++) yrs.push(k);
  if(!yrs.includes(y)) yrs.push(y);
  const tasks = S.me.weekly_tasks ? `<details class="mytasks"><summary>Mis tareas semanales</summary><pre>${esc(S.me.weekly_tasks)}</pre></details>` : '';
  return `<div class="page-head"><h2>Calendario de edición</h2><div class="spacer"></div>
    ${canManage() ? `<button class="btn" data-act="cal-new">+ Asignar video</button>` : ''}</div>${tasks}
    <div class="cal-head">
      <button class="ghost" data-act="cal-prev">‹</button><h3>${MONTHS[m]} ${y}</h3><button class="ghost" data-act="cal-next">›</button>
      <select data-change="cal-month">${MONTHS.map((n,i) => `<option value="${i}" ${i===m?'selected':''}>${n[0].toUpperCase()+n.slice(1)}</option>`).join('')}</select>
      <select data-change="cal-year">${yrs.sort().map(k => `<option ${k===y?'selected':''}>${k}</option>`).join('')}</select>
      <button class="ghost" data-act="cal-today">Hoy</button>
      ${canManage() ? `<select data-change="cal-editor" style="margin-left:auto"><option value="">Todos los editores</option>${S.team.filter(t => t.role !== 'Dirección').map(t => `<option value="${t.id}" ${S.cal.editor===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select>` : ''}
    </div>${weekGoals()}<div class="cal ${canManage() ? 'can-move' : ''}"><div class="dows">${DOW.map(d => `<div class="dow">${d}</div>`).join('')}</div>${weeks}</div>`;
}

  <div class="f"><label>Fecha de fin (opcional)</label><input type="date" name="end_date" value="${esc(it.end_date||'')}" ${ro?'disabled':''}></div></div>
  <div class="f"><label>Cliente</label><select name="client_id" id="it-client" ${ro?'disabled':''}>${clientsOpt}</select></div>
  <div class="f"><label>Guion</label><select id="it-script" ${ro?'disabled':''}></select><div class="hint" id="it-script-hint"></div></div>
  <div class="row2"><div class="f"><label>Folio / número de video</label><input type="text" name="video_number" id="it-vn" value="${esc(it.video_number||preset.video_number||'')}" ${ro?'disabled':''} placeholder="Ej. 10.3"></div>
  <div class="f"><label>Título del video</label><input type="text" name="title" id="it-title" value="${esc(it.title||preset.title||'')}" ${ro?'disabled':''}></div></div>
  <div class="f"><label>Responsable (editor)</label><select name="editor_id" id="it-editor" ${ro?'disabled':''}>${memberOptions(it.editor_id || preset.editor_id)}</select></div>
  <div class="f"><label>Progreso de edición</label><div class="range"><input type="range" name="progress" id="it-prog" min="0" max="100" step="5" value="${prog}"><b id="it-prog-v">${prog}%</b></div>
    <div class="bar" style="margin-top:8px"><i id="it-bar" style="width:${prog}%"></i></div></div>
  <div class="f"><label>Notas</label><textarea name="notes" rows="2" ${ro?'disabled':''}>${esc(it.notes||'')}</textarea></div>
  <div class="mfoot" style="justify-content:flex-start;margin-top:0"><button type="button" class="btn sec small" id="it-done">✓ Marcar como listo</button>
    <a class="btn sec small" id="it-folder" target="_blank" rel="noopener" style="text-decoration:none">Abrir carpeta</a></div>`;
  openModal(editing ? 'Tarjeta de video' : 'Asignar video', body, async fd => {
    const prog = +fd.get('progress');
    if(ro){
      const r = await rpc('crm_set_progress', {p_token:T(), p_id:it.id, p_progress:prog});
      if(r && r.error) throw new Error(errMsg(r.error));
    }else{
      if(!fd.get('client_id')) throw new Error('Elige un cliente');
      const row = {client_id:fd.get('client_id'), video_number:fd.get('video_number')||null, title:fd.get('title')||null,
        start_date:fd.get('start_date'), end_date:fd.get('end_date')||null, editor_id:fd.get('editor_id')||null,
        progress:prog, done:prog === 100, notes:fd.get('notes')||null};
      if(row.end_date && row.end_date < row.start_date) throw new Error('La fecha de fin no puede ser antes del inicio');
      if(fd.get('id')) row.id = fd.get('id');
      const r = await saveRow('calendar_items', row);
      if(r && r.error) throw new Error(errMsg(r.error));
    }
    await refresh(); toast('Guardado');
  }, () => {
    const p = $('#it-prog'), pv = $('#it-prog-v'), bar = $('#it-bar'), d = $('#it-done'), f = $('#it-folder'), cs = $('#it-client'), ed = $('#it-editor');
    const sync = () => { pv.textContent = p.value + '%'; bar.style.width = p.value + '%'; d.textContent = +p.value === 100 ? '↺ Reabrir (95%)' : '✓ Marcar como listo'; };
    p.addEventListener('input', sync);
    d.addEventListener('click', () => { p.value = +p.value === 100 ? 95 : 100; sync(); });
    const folder = () => { const c = client(cs.value), u = c ? safeUrl(c.folder_link) : ''; if(u){ f.href = u; f.style.opacity = 1; f.style.pointerEvents = ''; f.textContent = 'Abrir ' + linkLabel(u); } else { f.removeAttribute('href'); f.style.opacity = .4; f.style.pointerEvents = 'none'; f.textContent = 'Sin carpeta'; } };

    const sel = $('#it-script'), hint = $('#it-script-hint'), vn = $('#it-vn'), ti = $('#it-title');
    const norm = v => String(v || '').trim().replace(/^#/, '');
    const scripts = () => S.scripts.filter(s => s.client_id === cs.value).sort(byFolio);
    const booked = s => S.items.some(x => x.id !== it.id && x.client_id === s.client_id && norm(x.video_number) === norm(s.video_number));
    const showHint = () => {
      const s = S.scripts.find(x => x.id === sel.value);
      hint.textContent = s ? `Estado del guion: ${s.status}${booked(s) ? ' · ojo: este folio ya está en el calendario' : ''}` : (cs.value && !scripts().length ? 'Este cliente todavía no tiene guiones.' : '');
    };
    const fillScripts = () => {
      const list = scripts(), cur = list.find(s => norm(s.video_number) === norm(vn.value));
      sel.innerHTML = `<option value="">${cs.value ? (list.length ? '— Elige un guion del cliente —' : '— Sin guiones —') : '— Primero elige un cliente —'}</option>` +
        list.map(s => `<option value="${s.id}" ${cur && cur.id === s.id ? 'selected' : ''}>${esc(s.video_number)} — ${esc(s.title || 'Sin título')}${booked(s) ? ' · ya agendado' : ''}</option>`).join('');
      showHint();
    };
    sel.addEventListener('change', () => {
      const s = S.scripts.find(x => x.id === sel.value);
      if(s){ vn.value = s.video_number; ti.value = s.title || ''; }
      showHint();
    });
    vn.addEventListener('input', () => {
      const s = scripts().find(x => norm(x.video_number) === norm(vn.value));
      sel.value = s ? s.id : '';
      if(s && !ti.value.trim()) ti.value = s.title || '';
      showHint();
    });
    cs.addEventListener('change', () => { const c = client(cs.value); if(c && c.editor_id && !ed.value) ed.value = c.editor_id; folder(); fillScripts(); });
    sync(); folder(); fillScripts();
  }, editing && isAdmin() ? async () => {
    if(!confirm('¿Eliminar esta tarjeta del calendario?')) return false;
    const r = await delRow('calendar_items', it.id);
    if(r && r.error) throw new Error(r.error === 'sin_funcion' ? 'El borrado aún no está activado en la base de datos.' : errMsg(r.error));
    await refresh(); toast('Eliminado'); return true;
  } : null);
}

const P = {client:null, scripts:[], events:[], tab:'guiones', open:null, err:'', cal:{y:new Date().getFullYear(), m:new Date().getMonth()}};
async function loadPortal(){
  try{
    const r = await rpc('portal_get', {p_key:PORTAL_KEY});
    if(r && r.error) P.err = errMsg(r.error);
    else {
      P.client = r.client; P.scripts = r.scripts || []; P.events = r.events || [];
      if(P.client.client_type === 'eventos'){
        P.tab = 'calendario';
        // Abre en el mes del evento más reciente que ya pasó (o el de hoy si no hay)
        const t = todayStr(), past = P.events.filter(e => e.event_date <= t).pop() || P.events[0];
        if(past && !P.events.some(e => e.event_date.slice(0,7) === t.slice(0,7))){ P.cal = {y:+past.event_date.slice(0,4), m:+past.event_date.slice(5,7) - 1}; }
      }
    }
  }catch(e){ P.err = e.message; }
  if(P.client) document.title = P.client.name + ' · Ikonico Studio';
  S.loading = false; render();
}
const byFolio = (a,b) => String(a.video_number).localeCompare(String(b.video_number), undefined, {numeric:true});
function suggestFolio(list){
  const last = [...list].sort(byFolio).pop(); if(!last) return '1';
  const m = /^(.*?)(\d+)$/.exec(String(last.video_number).trim());
  return m ? m[1] + (+m[2] + 1) : String(list.length + 1);
}
function portalView(){
  const top = `<div class="ptop">${logoImgs()}<div class="spacer"></div><button class="ghost" data-act="theme" title="Cambiar tema">${S.theme==='dark'?'☀︎ Claro':'☾ Oscuro'}</button></div>`;
  if(!P.client) return `<div class="portal">${top}<div class="empty"><h3>No encontramos tu espacio</h3>${esc(P.err || 'Revisa el link que te compartieron.')}</div></div>`;
  const c = P.client, url = safeUrl(c.client_folder_link), list = [...P.scripts].sort(byFolio);
  const items = list.map(s => {
    const open = P.open === s.id, slug = stSlug(s.status);
    return `<div class="sc st-${slug} ${open?'open':''}">
      <div class="sc-h" data-act="pt-toggle" data-id="${s.id}"><b>${esc(s.video_number)} — ${esc(s.title || 'Sin título')}</b><span class="st ${slug}">${esc(s.status)}</span><span class="car">▾</span></div>
      ${open ? `<div class="sc-b"><div class="txt">${esc(s.content || 'Sin texto todavía.')}</div>
        <div class="sc-a"><button class="btn sec small" data-act="pt-edit" data-id="${s.id}">✎ Editar guion</button></div></div>` : ''}
    </div>`;
  }).join('');
  const isEv = c.client_type === 'eventos';
  const showScripts = c.portal_scripts !== false;
  const ptabs = isEv ? [['calendario','📅 Calendario']].concat(showScripts && list.length ? [['guiones','📄 Guiones']] : [], url ? [['videos','📁 Tu carpeta de ' + linkLabel(url)]] : [])
    : (showScripts ? [['guiones','📄 Guiones']] : []).concat([['videos','🎬 Tus videos']]);
  if(!ptabs.find(t => t[0] === P.tab)) P.tab = ptabs[0][0];
  const body = P.tab === 'calendario' ? portalCalendar() : P.tab === 'videos'
    ? `<div class="cbox vbox">${url ? `<p>Aquí están tus videos, listos para revisar y descargar.</p><a class="btn" href="${esc(url)}" target="_blank" rel="noopener" style="text-decoration:none">🎬 Abrir mi carpeta en ${linkLabel(url)}</a>` : `<p>Tu carpeta de videos todavía no está lista. En cuanto la tengamos, aparecerá aquí.</p>`}</div>`
    : `<div class="page-head" style="margin-bottom:12px"><span class="hint" style="margin:0">${list.length} guion${list.length===1?'':'es'} · Ikonico Studio actualiza el estado de cada uno</span><div class="spacer"></div>
        <button class="btn" data-act="pt-new">+ Nuevo guion</button></div>
      ${list.length ? items : `<div class="empty"><h3>Aún no hay guiones</h3>Escribe el primero con “Nuevo guion”: el número de video y lo que quieres decir en él.</div>`}`;
  return `<div class="portal">${top}
    <div class="hero"><div class="kick">Ikonico Studio</div><div class="em">${esc(c.emoji || '🎬')}</div><h1>Hola, ${esc(c.name)}</h1>
      <p>${isEv ? 'Gracias por tu confianza. Aquí está el calendario de tus eventos: dale clic a cada uno para abrir directo sus videos y sus fotos.'
        : showScripts ? 'Gracias por tu confianza. Este es tu espacio: aquí puedes ver y editar tus guiones y abrir la carpeta con tus videos.'
        : 'Gracias por tu confianza. Este es tu espacio: aquí puedes abrir la carpeta con tus videos.'}</p></div>
    <div class="cp-tabs">${ptabs.map(([k,l]) => `<div class="${P.tab===k?'on':''}" data-act="pt-tab" data-v="${k}">${l}</div>`).join('')}</div>
    ${body}</div>`;
}
function evButtons(ev){
  const v = safeUrl(ev.video_link), f = safeUrl(ev.photos_link);
  return (v ? `<a href="${esc(v)}" target="_blank" rel="noopener">🎬 Videos</a>` : `<span>🎬 ${ev.reel_status === 'Entregado' ? 'Sin link' : 'En proceso'}</span>`) +
    (f ? `<a href="${esc(f)}" target="_blank" rel="noopener">📷 Fotos</a>` : `<span>📷 ${ev.photos_status === 'Entregado' ? 'Sin link' : 'En proceso'}</span>`);
}
function portalCalendar(){
  const {y, m} = P.cal, first = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate(), tStr = todayStr();
  const total = Math.ceil((first + days) / 7) * 7, mk = `${y}-${pad2(m + 1)}`;
  let cells = '';
  for(let i = 0; i < total; i++){
    const dd = i - first + 1, inMonth = dd >= 1 && dd <= days, ds = inMonth ? `${mk}-${pad2(dd)}` : '';
    const evs = inMonth ? P.events.filter(e => e.event_date === ds) : [];
    cells += `<div class="cell ${inMonth ? '' : 'out'} ${ds === tStr ? 'today' : ''} ${i % 7 === 6 ? 'c7' : ''}" style="grid-row:auto">${inMonth ? `<div class="num">${dd}</div>` : ''}
      ${evs.map(e => `<div class="ev" title="${esc(e.title + (e.place ? ' · ' + e.place : ''))}"><b>🎓 ${esc(e.title)}</b>${e.place ? `<span class="pl">${esc(e.place)}</span>` : ''}<div class="evl">${evButtons(e)}</div></div>`).join('')}</div>`;
  }
  const monthEvents = P.events.filter(e => e.event_date.slice(0,7) === mk);
  const rows = monthEvents.map(e => `<div class="evrow"><div class="d">${+e.event_date.slice(8,10)}</div>
    <div class="tx"><b>🎓 ${esc(e.title)}</b><small>${esc(e.place || '')}${e.place ? ' · ' : ''}${fmtDay(e.event_date)}</small></div>
    <div class="bt ev" style="background:none;border:0;padding:0"><div class="evl" style="margin:0">${evButtons(e)}</div></div></div>`).join('');
  return `<div class="pcal-head"><button class="ghost" data-act="pt-prev">‹</button><h3>${MONTHS[m]} ${y}</h3><button class="ghost" data-act="pt-next">›</button>
      <span class="hint" style="margin:0 0 0 auto">${P.events.length} evento${P.events.length===1?'':'s'} en total</span></div>
    <div class="cal pcal"><div class="dows">${DOW.map(d => `<div class="dow">${d}</div>`).join('')}</div><div class="wk">${cells}</div></div>
    <div class="evlist">${rows || `<div class="empty"><h3>Sin eventos este mes</h3>Usa las flechas para ver otros meses.</div>`}</div>`;
}
function portalForm(s){
  s = s || {}; const editing = !!s.id;
  const body = `<div class="f"><label>Número de video</label><input type="text" name="video_number" required maxlength="20" value="${esc(s.video_number || suggestFolio(P.scripts))}"></div>
  <div class="f"><label>Título del video</label><input type="text" name="title" maxlength="300" value="${esc(s.title||'')}" placeholder="Ej. 3 tips para emprender"></div>
  <div class="f"><label>Guion</label><textarea name="content" rows="14" placeholder="Lo que quieres decir, ideas de tomas, textos en pantalla…">${esc(s.content||'')}</textarea>
    ${editing ? `<div class="hint">Estado actual: ${esc(s.status)}. El estado lo actualiza Ikonico Studio.</div>` : ''}</div>`;
  openModal(editing ? 'Editar guion' : 'Nuevo guion', body, async fd => {
    const row = {video_number:fd.get('video_number').trim(), title:fd.get('title'), content:fd.get('content')};
    if(s.id) row.id = s.id;
    const r = await rpc('portal_save_script', {p_key:PORTAL_KEY, p_row:row});
    if(r && r.error) throw new Error(errMsg(r.error));
    const i = P.scripts.findIndex(x => x.id === r.id); if(i >= 0) P.scripts[i] = r; else P.scripts.push(r);
    P.open = r.id; render(); toast('Guion guardado');
  });
}
async function genPortalLink(id, regen){
  if(regen && !confirm('¿Generar un link nuevo? El link anterior dejará de funcionar.')) return;
  try{
    const r = await rpc('crm_client_link', {p_token:T(), p_client_id:id, p_regen:!!regen});
    if(r && r.error){ toast(errMsg(r.error)); return; }
    const c = client(id); if(c) c.portal_token = r.portal_token;
    render(); toast(regen ? 'Link nuevo generado' : 'Link generado');
  }catch(e){ toast(e.message); }
}

const blankItem = () => ({id:qid(), titulo:'', descripcion:'', cantidad:1, precio:0});
const qNextFolio = () => { const s = qset(); return s.prefix + String(s.next_number || 1).padStart(Math.max(1, +s.digits || 4), '0'); };
const qErr = e => ERR_TXT[e.message] || e.message;

  catch(e){ S.quotes = []; S.qready = false; S.qerr = e.code === 'PGRST202' ? 'Falta activar las cotizaciones en la base de datos.' : e.message; }
}

const rowToQuote = r => ({id:r.id, folio:r.folio, status:r.status, client_id:r.client_id || '', data:JSON.parse(JSON.stringify(r.data || {}))});
function qTotals(d){
  const subtotal = (d.items || []).reduce((a, it) => a + qnum(it.cantidad) * qnum(it.precio), 0);
  const dv = qnum(d.descuento && d.descuento.valor);
  const descuento = Math.min(subtotal, d.descuento && d.descuento.tipo === 'monto' ? dv : subtotal * dv / 100);
  const base = subtotal - descuento, iva = d.iva ? base * 0.16 : 0;
  return {subtotal, descuento, iva, total: Math.round((base + iva) * 100) / 100};
}
function numeroALetras(n){
  const U = ['','UN','DOS','TRES','CUATRO','CINCO','SEIS','SIETE','OCHO','NUEVE'];
  const E = ['DIEZ','ONCE','DOCE','TRECE','CATORCE','QUINCE','DIECISÉIS','DIECISIETE','DIECIOCHO','DIECINUEVE',
             'VEINTE','VEINTIÚN','VEINTIDÓS','VEINTITRÉS','VEINTICUATRO','VEINTICINCO','VEINTISÉIS','VEINTISIETE','VEINTIOCHO','VEINTINUEVE'];
  const D = ['','','','TREINTA','CUARENTA','CINCUENTA','SESENTA','SETENTA','OCHENTA','NOVENTA'];
  const C = ['','CIENTO','DOSCIENTOS','TRESCIENTOS','CUATROCIENTOS','QUINIENTOS','SEISCIENTOS','SETECIENTOS','OCHOCIENTOS','NOVECIENTOS'];
  const dos = x => x < 10 ? U[x] : x < 30 ? E[x-10] : D[Math.floor(x/10)] + (x % 10 ? ' Y ' + U[x % 10] : '');
  const tres = x => x === 100 ? 'CIEN' : [C[Math.floor(x/100)], dos(x % 100)].filter(Boolean).join(' ');
  const entero = Math.floor(n + 1e-9), cent = Math.round((n - entero) * 100);
  const mill = Math.floor(entero / 1e6), miles = Math.floor((entero % 1e6) / 1000), resto = entero % 1000;
  const parts = [];
  if(mill) parts.push(mill === 1 ? 'UN MILLÓN' : tres(mill) + ' MILLONES');
  if(miles) parts.push(miles === 1 ? 'MIL' : tres(miles) + ' MIL');
  if(resto) parts.push(tres(resto));
  let txt = parts.join(' ') || 'CERO';
  if(mill && !miles && !resto) txt += ' DE';
  return `${txt} ${entero === 1 ? 'PESO' : 'PESOS'} ${pad2(cent)}/100 M.N.`;
}

}

  const tt = $('#qtotal'); if(tt) tt.textContent = money(qTotals(S.q.data).total);
  const b = $('#qstate'); if(b){ b.textContent = 'Sin guardar'; b.className = 'badge dir'; }
}

function openQuote(q){ S.q = q; S.qdirty = false; S.view = 'quote'; render(); window.scrollTo(0, 0); }

async function saveQuote(silent){
  const q = S.q, d = q.data;
  if(!String(d.cliente.nombre || '').trim()){ toast('Escribe el nombre del cliente antes de guardar'); const i = document.querySelector('[data-q="cliente.nombre"]'); if(i) i.focus(); return false; }
  try{
    const r = await rpc('crm_quote_save', {p_token:T(), p_row:{id:q.id, client_id:q.client_id || null, data:d, total:qTotals(d).total, status:q.status}});
    if(r && r.error) throw new Error(r.error);
    const i = S.quotes.findIndex(x => x.id === r.id); i >= 0 ? (S.quotes[i] = r) : S.quotes.unshift(r);
    if(!q.folio) S.qset = Object.assign({}, S.qset, {next_number: r.folio_num + 1});
    S.q = rowToQuote(r); S.qdirty = false;
    if(S.view === 'quote') render();
    if(!silent) toast(`Cotización ${r.folio} guardada`);
    return true;
  }catch(e){ toast(qErr(e)); return false; }
}
async function saveQuoteSettings(next){
  const r = await rpc('crm_quote_settings_save', {p_token:T(), p_settings:next});
  if(r && r.error) throw new Error(r.error);
  S.qset = r;
}
function printQuote(q){
  let pr = $('#print-root'); if(!pr){ pr = document.createElement('div'); pr.id = 'print-root'; document.body.appendChild(pr); }
  pr.innerHTML = `<div class="qs">${sheetHTML(q)}</div>`;
  const zoom = document.body.style.zoom, title = document.title;
  document.documentElement.classList.add('pq'); document.body.style.zoom = '';
  document.title = `Cotización ${q.folio} - ${q.data.cliente.nombre}`.replace(/[\\/:*?"<>|]/g, '');
  const done = () => { document.documentElement.classList.remove('pq'); pr.innerHTML = ''; document.body.style.zoom = zoom; document.title = title; window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  const img = pr.querySelector('img');
  (img && img.decode ? img.decode().catch(() => {}) : Promise.resolve()).then(() => setTimeout(() => window.print(), 60));
}

    <div class="f"><label>Catálogo de servicios</label>${cat || '<div class="hint">Vacío. Usa ☆ en un servicio para guardarlo aquí.</div>'}</div>`,
    async fd => {
      const del = new Set(fd.getAll('cat_del').map(Number));
      const next = {prefix:fd.get('prefix').trim() || 'IKO-', digits:qnum(fd.get('digits')) || 4, next_number:qnum(fd.get('next_number')) || 1,
        phone:fd.get('phone'), instagram:fd.get('instagram'), email:fd.get('email'), validity:qnum(fd.get('validity')) || 10,
        intro:fd.get('intro'), payment:fd.get('payment'), bank:fd.get('bank'), catalog:s.catalog.filter((x, i) => !del.has(i))};
      await saveQuoteSettings(next); render(); toast('Ajustes guardados');
    });
}

/* ====== Modal ====== */
function closeModal(){ $('#modal-root').innerHTML = ''; }
function openModal(title, body, onSubmit, onMount, onDelete){
  $('#modal-root').innerHTML = `<div class="overlay" data-act="overlay"><div class="modal"><h3>${esc(title)}</h3>
    <form id="mform" autocomplete="off">${body}
    <div class="err" id="merr" style="margin-top:6px"></div>
    <div class="mfoot">${onDelete ? '<button type="button" class="btn danger" id="mdel" style="margin-right:auto">Eliminar</button>' : ''}
      <button type="button" class="btn sec" data-act="modal-close">${onSubmit ? 'Cancelar' : 'Cerrar'}</button>${onSubmit ? '<button class="btn" id="msave">Guardar</button>' : ''}</div></form></div></div>`;
  const form = $('#mform');
  form.addEventListener('submit', async e => {
    e.preventDefault(); if(!onSubmit) return;
    const b = $('#msave'); b.disabled = true; b.textContent = 'Guardando…'; $('#merr').textContent = '';
    try{ await onSubmit(new FormData(form)); closeModal(); }
    catch(err){ $('#merr').textContent = err.message; b.disabled = false; b.textContent = 'Guardar'; }
  });
  if(onDelete){ $('#mdel').addEventListener('click', async () => {
    try{ if(await onDelete()) closeModal(); }catch(err){ $('#merr').textContent = err.message; } }); }
  if(onMount) onMount();
  const first = form.querySelector('input:not([type=hidden]):not([disabled]),textarea'); if(first && !first.type.match(/date|color|range/)) first.focus();
}
async function refresh(){ await loadAll(); try{ S.me = await rpc('crm_me', {p_token:T()}); }catch(e){} render(); }

/* ====== Eventos ====== */
async function confirmDelete(tbl, id, label){
  if(!confirm(`¿Eliminar ${label}? Esta acción no se puede deshacer.`)) return;
  try{
    const r = await delRow(tbl, id);
    if(r && r.error){ toast(r.error === 'sin_funcion' ? 'El borrado aún no está activado en la base de datos.' : errMsg(r.error)); return; }
    await refresh(); toast('Eliminado');
  }catch(e){ toast(e.message); }
}
const H = {
  tab:(t) => { S.view = t.dataset.v; S.standalone = false; render(); },
  theme:() => { S.theme = S.theme === 'dark' ? 'light' : 'dark'; store.set('ikonico_theme', S.theme); applyPrefs(); render(); },
  zoom:(t) => { S.zoom = Math.min(130, Math.max(60, S.zoom + (+t.dataset.d))); store.set('ikonico_zoom', S.zoom); applyPrefs(); render(); },
  logout:() => doLogout(),
  key:(t) => pinKey(t.dataset.k),
  'modal-close':() => closeModal(),
  'team-new':() => teamForm(),
  'team-edit':(t) => teamForm(S.team.find(x => x.id === t.dataset.id)),
  'team-del':(t) => { const m = member(t.dataset.id); confirmDelete('team_members', t.dataset.id, m ? m.name : 'esta persona'); },
  'client-new':() => clientForm(),
  'client-edit':(t) => clientForm(client(t.dataset.id)),
  'client-del':(t) => { const c = client(t.dataset.id); confirmDelete('clients', t.dataset.id, `al cliente ${c ? c.name : ''} (también sus guiones y videos)`); },
  'client-open':(t) => openClient(t.dataset.id),
  'client-back':() => { S.view = S.prevView && S.prevView !== 'client' ? S.prevView : (canManage() ? 'clients' : 'calendar'); S.openScript = null; render(); window.scrollTo(0, 0); },
  'sc-toggle':(t) => { S.openScript = S.openScript === t.dataset.id ? null : t.dataset.id; render(); },
  copy:(t) => { const v = t.dataset.v; (navigator.clipboard ? navigator.clipboard.writeText(v) : Promise.reject()).then(() => toast('Link copiado'), () => { prompt('Copia el link:', v); }); },
  'cp-tab':(t) => { S.clientTab = t.dataset.v; render(); },
  'ev-new':() => eventForm(),
  'ev-edit':(t) => eventForm(S.events.find(x => x.id === t.dataset.id)),
  'pt-prev':() => { P.cal.m--; if(P.cal.m < 0){ P.cal.m = 11; P.cal.y--; } render(); },
  'pt-next':() => { P.cal.m++; if(P.cal.m > 11){ P.cal.m = 0; P.cal.y++; } render(); },
  'portal-gen':(t) => genPortalLink(t.dataset.id, !!t.dataset.regen),
  'pt-tab':(t) => { P.tab = t.dataset.v; render(); },
  'pt-toggle':(t) => { P.open = P.open === t.dataset.id ? null : t.dataset.id; render(); },
  'pt-new':() => portalForm(),
  'pt-edit':(t) => portalForm(P.scripts.find(x => x.id === t.dataset.id)),
  'script-new':() => scriptForm(),
  'script-edit':(t) => scriptForm(S.scripts.find(x => x.id === t.dataset.id)),
  'script-del':(t) => confirmDelete('scripts', t.dataset.id, 'este guion'),
  'script-sched':(t) => { const s = S.scripts.find(x => x.id === t.dataset.id), c = client(s.client_id);
    itemForm(null, todayStr(), {client_id:s.client_id, video_number:s.video_number, title:s.title, editor_id:c && c.editor_id}); },
  'cal-prev':() => { S.cal.m--; if(S.cal.m < 0){ S.cal.m = 11; S.cal.y--; } render(); },
  'cal-next':() => { S.cal.m++; if(S.cal.m > 11){ S.cal.m = 0; S.cal.y++; } render(); },
  'cal-today':() => { const n = new Date(); S.cal.y = n.getFullYear(); S.cal.m = n.getMonth(); render(); },
  'cal-new':() => itemForm(null, todayStr()),
  'cal-day':(t, e) => { if(e.target.closest('.pill')) return; if(canManage()) itemForm(null, t.dataset.d); },
  'cal-item':(t) => itemForm(S.items.find(x => x.id === t.dataset.id)),
  'cal-done':(t) => toggleDone(t.dataset.id),
  'cal-script':(t) => {
    const s = S.scripts.find(x => x.id === t.dataset.id); if(!s) return;
    const w = window.open(location.pathname + '?guion=' + encodeURIComponent(s.id), '_blank');
    if(!w) openClient(s.client_id, s.id);
  },
  'close-tab':() => {
    window.close();
    S.standalone = false; history.replaceState(null, '', location.pathname); S.view = 'calendar'; render();
  },
  'quote-new':() => openQuote(newQuote()),
  'quote-resume':() => { S.view = 'quote'; render(); },
  'quote-open':(t) => openQuote(rowToQuote(S.quotes.find(x => x.id === t.dataset.id))),
  'quote-dup':(t) => {
    const q = rowToQuote(S.quotes.find(x => x.id === t.dataset.id));
    q.id = null; q.folio = null; q.status = 'borrador'; q.data.fecha = todayStr(); q.data.items.forEach(it => it.id = qid());
    openQuote(q); S.qdirty = true; toast('Copia lista: recibirá un folio nuevo al guardarla');
  },
  'quote-pdf':(t) => printQuote(rowToQuote(S.quotes.find(x => x.id === t.dataset.id))),
  'quote-del':async (t) => {
    const q = S.quotes.find(x => x.id === t.dataset.id);
    if(!confirm(`¿Eliminar la cotización ${q.folio}? Esta acción no se puede deshacer y el folio no se reutiliza.`)) return;
    try{ await rpc('crm_quote_delete', {p_token:T(), p_id:q.id}); S.quotes = S.quotes.filter(x => x.id !== q.id); if(S.q && S.q.id === q.id) S.q = null; render(); toast('Cotización eliminada'); }
    catch(e){ toast(qErr(e)); }
  },
  'quote-settings':() => quoteSettingsForm(),
  'quote-back':() => { S.view = 'quotes'; render(); window.scrollTo(0, 0); },
  'quote-save':() => saveQuote(),
  'quote-print':async () => { if((S.qdirty || !S.q.folio) && !(await saveQuote(true))) return; printQuote(S.q); },
  'qi-add':() => { S.q.data.items.push(blankItem()); qItemsChanged(); const l = document.querySelector('#qitems .qitem:last-child input'); if(l) l.focus(); },
  'qi-up':(t) => { const a = S.q.data.items, i = a.findIndex(x => x.id === t.closest('[data-qitem]').dataset.qitem); if(i > 0){ [a[i-1], a[i]] = [a[i], a[i-1]]; qItemsChanged(); } },
  'qi-down':(t) => { const a = S.q.data.items, i = a.findIndex(x => x.id === t.closest('[data-qitem]').dataset.qitem); if(i < a.length - 1){ [a[i+1], a[i]] = [a[i], a[i+1]]; qItemsChanged(); } },
  'qi-del':(t) => { const a = S.q.data.items; a.splice(a.findIndex(x => x.id === t.closest('[data-qitem]').dataset.qitem), 1); if(!a.length) a.push(blankItem()); qItemsChanged(); },
  'qi-fav':async (t) => {
    const it = S.q.data.items.find(x => x.id === t.closest('[data-qitem]').dataset.qitem);
    if(!it.titulo.trim()) return toast('Ponle nombre al servicio primero');
    const s = qset(), catalog = s.catalog.slice(), entry = {titulo:it.titulo.trim(), descripcion:it.descripcion, precio:qnum(it.precio)};
    const i = catalog.findIndex(x => x.titulo === entry.titulo); i >= 0 ? (catalog[i] = entry) : catalog.push(entry);
    try{ await saveQuoteSettings(Object.assign(s, {catalog})); render(); toast(i >= 0 ? 'Servicio actualizado en el catálogo' : 'Servicio guardado en el catálogo'); }
    catch(e){ toast(qErr(e)); }
  },
  overlay:(t, e) => { if(e.target === t) closeModal(); }
};
document.addEventListener('click', e => {
  if(skipClick || e.target.closest('[data-rz]')){ skipClick = false; return; }
  const t = e.target.closest('[data-act]'); if(!t) return;
  const fn = H[t.dataset.act]; if(!fn) return;
  if(t.dataset.act === 'cal-day' && e.target.closest('.pill')) return;
  fn(t, e);
});
document.addEventListener('change', e => {
  const t = e.target.closest('[data-change]'); if(!t) return;
  const k = t.dataset.change, v = t.value;
  if(k === 'quote-status'){
    const q = S.quotes.find(x => x.id === t.dataset.id);
    rpc('crm_quote_save', {p_token:T(), p_row:{id:q.id, status:v}}).then(r => { Object.assign(q, r); toast(`${q.folio}: ${QST[v]}`); }).catch(e => { toast(qErr(e)); render(); });
    return;
  }
  if(k === 'quote-cat'){
    const c = qset().catalog[v]; if(!c) return;
    const a = S.q.data.items, it = {id:qid(), titulo:c.titulo, descripcion:c.descripcion, cantidad:1, precio:qnum(c.precio)};
    if(a.length === 1 && !a[0].titulo && !a[0].descripcion && !qnum(a[0].precio)) a[0] = it; else a.push(it);
    t.value = ''; qItemsChanged(); return;
  }
  if(k === 'quote-client'){
    const c = client(v); S.q.client_id = v;
    if(c){ S.q.data.cliente.nombre = c.name; if(c.email && !S.q.data.cliente.email) S.q.data.cliente.email = c.email; }
    S.qdirty = true;
  }
  else if(k === 'quote-filter') S.qfilter = v;
  else if(k === 'client-filter') S.clientFilter = v;
  else if(k === 'script-client') S.scriptClient = v;
  else if(k === 'cal-month') S.cal.m = +v;
  else if(k === 'cal-year') S.cal.y = +v;
  else if(k === 'cal-editor') S.cal.editor = v;
  render();
});
document.addEventListener('keydown', e => { if(e.key === 'Escape' && $('#modal-root').innerHTML) closeModal(); });
/* Editor de cotizaciones: se actualiza solo la vista previa para no perder el foco al escribir */
document.addEventListener('input', e => {
  const t = e.target; if(S.view !== 'quote' || !S.q) return;
  const val = t.type === 'checkbox' ? t.checked : t.type === 'number' ? (t.value === '' ? '' : qnum(t.value)) : t.value;
  if(t.dataset.q){
    const ks = t.dataset.q.split('.'), last = ks.pop();
    ks.reduce((a, k) => a[k], S.q.data)[last] = val; qChanged();
  }else if(t.dataset.qi){
    const box = t.closest('[data-qitem]'), it = S.q.data.items.find(x => x.id === box.dataset.qitem);
    it[t.dataset.qi] = val;
    const imp = box.querySelector('.qimp b'); if(imp) imp.textContent = money(qnum(it.cantidad) * qnum(it.precio));
    qChanged();
  }
});
window.addEventListener('resize', () => { if(S.view === 'quote') qFit(); });
window.addEventListener('beforeunload', e => { if(S.q && S.qdirty){ e.preventDefault(); e.returnValue = ''; } });
boot();
